name: publish-package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setting up build version
        shell: bash
        run: |
          echo "BUILD_VERSION=4.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore tests
        run: dotnet restore test/Soenneker.Dtos.Results.Operation.Tests/Soenneker.Dtos.Results.Operation.Tests.csproj --verbosity minimal

      - name: Build tests
        run: dotnet build test/Soenneker.Dtos.Results.Operation.Tests/Soenneker.Dtos.Results.Operation.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Dtos.Results.Operation.Tests/Soenneker.Dtos.Results.Operation.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal


      - name: Restore library
        run: dotnet restore src/Soenneker.Dtos.Results.Operation/Soenneker.Dtos.Results.Operation.csproj --verbosity minimal

      - name: Build library
        run: dotnet build src/Soenneker.Dtos.Results.Operation/Soenneker.Dtos.Results.Operation.csproj --configuration Release --no-restore --verbosity minimal

      - name: Pack
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet pack src/Soenneker.Dtos.Results.Operation/Soenneker.Dtos.Results.Operation.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./artifacts

      - name: Log in to NuGet
        id: nuget-login
        shell: bash
        timeout-minutes: 6
        env:
          NUGET_USER: soenneker
        run: |
          set -euo pipefail

          oidc_response="$(curl --silent --show-error --fail \
            --connect-timeout 30 \
            --max-time 30 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.nuget.org")"

          oidc_token="$(jq -er '.value | strings | select(length > 0)' <<< "$oidc_response")"
          echo "::add-mask::$oidc_token"

          body="$(jq -nc --arg username "$NUGET_USER" \
            '{username: $username, tokenType: "ApiKey"}')"

          echo "Requesting NuGet publishing key (timeout: 300 seconds)..."
          started=$SECONDS
          response_dir="$(mktemp -d)"
          trap 'rm -rf "$response_dir"' EXIT

          curl_exit=0
          http_status="$(curl --silent --show-error \
            --connect-timeout 30 \
            --max-time 300 \
            --dump-header "$response_dir/headers" \
            --output "$response_dir/body" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --user-agent "nuget/login-action" \
            --data "$body" \
            https://www.nuget.org/api/v2/token)" || curl_exit=$?

          api_key="$(jq -er '.apiKey | strings | select(length > 0)' "$response_dir/body" 2>/dev/null)" || api_key=""
          if [[ -n "$api_key" ]]; then
            echo "::add-mask::$api_key"
          fi

          echo "NuGet token exchange: HTTP $http_status, curl exit $curl_exit, elapsed $((SECONDS - started)) seconds."
          if [[ "$curl_exit" -ne 0 || "$http_status" != "200" || -z "$api_key" ]]; then
            echo "::group::NuGet token exchange response"
            # Treat response text as data, not GitHub workflow commands.
            stop_token="$(cat /proc/sys/kernel/random/uuid)"
            echo "::stop-commands::$stop_token"
            echo "Response headers:"
            cat "$response_dir/headers" 2>/dev/null || true
            printf '\nResponse body:\n'
            cat "$response_dir/body" 2>/dev/null || true
            printf '\n::%s::\n' "$stop_token"
            echo "::endgroup::"
            echo "::error::NuGet token exchange failed. See the response above."
            exit 1
          fi

          echo "NUGET_API_KEY=$api_key" >> "$GITHUB_OUTPUT"
          echo "NuGet login succeeded in $((SECONDS - started)) seconds."

      - name: Publish to NuGet
        uses: soenneker/nuget-resilient-publish@v4
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: 'artifacts/*.nupkg'

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/soenneker/index.json" \
            --api-key "${{ secrets.GH__TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN }}
        shell: bash
        run: |
          gh release create "v$BUILD_VERSION" \
            --title "v$BUILD_VERSION" \
            --notes "$PACKAGE_RELEASE_NOTES"
